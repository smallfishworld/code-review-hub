name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2022]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Keep node-gyp on the VS 2022 / Python 3.12 toolchain.
      - name: Setup Python for native modules (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Configure node-gyp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "NODE_GYP_FORCE_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV

      - name: Install Subversion for SVN tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Subversion for SVN tests (macOS)
        if: runner.os == 'macOS'
        run: brew install subversion

      - name: Install Subversion for SVN tests (Windows)
        if: runner.os == 'Windows'
        run: choco install svn -y

      - name: Install server dependencies
        run: npm ci --include=optional

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Verify SQLite native binding
        run: node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.close()"

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build server and web
        run: npm run build
