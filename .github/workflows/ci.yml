name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install Subversion for SVN tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Subversion for SVN tests (macOS)
        if: runner.os == 'macOS'
        run: brew install subversion

      - name: Install Subversion for SVN tests (Windows)
        if: runner.os == 'Windows'
        run: choco install svn -y

      - name: Install dependencies
        run: |
          npm ci --include=optional
          npm --prefix web ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build server and web
        run: npm run build
