name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create as draft release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: "22.23.5"
  OCR_PACKAGE: "@smallfishworld/open-code-review-svn@1.13.8-svn.1"

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            DRAFT="${{ inputs.draft }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            DRAFT="false"
            if [[ "$TAG" == *"-"* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Lint, Tests & Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install Subversion for SVN tests
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install server dependencies
        run: npm ci --include=optional

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    name: Package (${{ matrix.target }})
    needs: [prepare, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            os: windows-2022
            script: scripts/package-win.mjs
            extra_args: ""
            artifact_glob: "release-out/*.zip"
          - target: macos-arm64
            os: macos-15
            script: scripts/package-mac.mjs
            extra_args: "--arch arm64"
            artifact_glob: "release-out/*.tar.gz"
          - target: macos-x64
            os: macos-15-intel
            script: scripts/package-mac.mjs
            extra_args: "--arch x64"
            artifact_glob: "release-out/*.tar.gz"
          - target: linux-x64
            os: ubuntu-26.04
            script: scripts/package-linux.mjs
            extra_args: "--arch x64"
            artifact_glob: "release-out/*.tar.gz"
          - target: linux-arm64
            os: ubuntu-24.04-arm
            script: scripts/package-linux.mjs
            extra_args: "--arch arm64"
            artifact_glob: "release-out/*.tar.gz"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Keep node-gyp on the VS 2022 / Python 3.12 toolchain.
      - name: Setup Python for native modules (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Configure node-gyp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "NODE_GYP_FORCE_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV

      - name: Install server dependencies
        run: npm ci --include=optional

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Verify SQLite native binding
        run: node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.close()"

      - name: Install ocr CLI globally
        run: npm install -g ${{ env.OCR_PACKAGE }}

      - name: Build portable package
        shell: bash
        run: |
          node ${{ matrix.script }} ${{ matrix.extra_args }} --version "${{ needs.prepare.outputs.version }}" --out release-out

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, package]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: package-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate bilingual release notes
        shell: bash
        run: |
          node scripts/generate-release-notes.mjs \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --artifacts-dir release-assets \
            --changelog CHANGELOG.md \
            --repo "${{ github.repository }}" \
            --out release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Code Review Hub ${{ needs.prepare.outputs.tag }}"
          body_path: release-notes.md
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
